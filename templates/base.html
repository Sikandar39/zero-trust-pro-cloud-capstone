<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Zero Trust Pro
        {% endblock %}
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<header class="navbar">

    <div class="logo-area">

        <img
            src="{{ url_for('static', filename='images/logo.png') }}"
            alt="Zero Trust Pro Logo"
            class="logo"
        >

        <span>Zero Trust Pro</span>

    </div>

    <nav>

        <a href="{{ url_for('home') }}">Home</a>

        <a href="{{ url_for('about') }}">About</a>

        <a href="{{ url_for('leadership') }}">Leadership</a>

        <a href="{{ url_for('domains') }}">Domains</a>

        <a href="{{ url_for('programs') }}">Programs</a>

        <a href="{{ url_for('contact') }}">Contact</a>

    </nav>

</header>


<main>

{% block content %}

{% endblock %}

</main>


<footer>

    <p>
        © 2026 Zero Trust Pro.
        Learn. Secure. Build with Confidence.
    </p>

</footer>

</body>

</html>
